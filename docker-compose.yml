services:
  app:
    build: .
    container_name: vulnlms-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/vulnlms
      - JWT_SECRET=super_secret_jwt_key_learning_lab_only
      - PORT=3000
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: vulnlms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
